# Construye la web en cada push a main y publica dist/ en la rama `deploy`.
# Hostinger (Business Web Hosting) despliega la rama `deploy` en public_html con autodeploy en cada push:
# no hace falta Node en el servidor y el .htaccess y el PHP del formulario van tal cual.
name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Variable del repositorio PUBLIC_NOINDEX=1 mientras la web está en el subdominio de prueba
      # (robots.txt bloquea y cada página lleva noindex). Quitarla al pasar a coolnetworks.eu.
      - run: npm run build
        env:
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX }}
      - name: Comprobar que no se publica ninguna credencial
        run: |
          if find dist -iname '*config*.php' | grep -q .; then echo "config PHP en dist/"; exit 1; fi
      - name: Publicar dist/ en la rama deploy
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
